# ─────────────────────────────────────────────────────────────
#  Travel Planner Agent — Application Properties
#  Set WATSONX_API_KEY, WATSONX_PROJECT_ID, WEATHER_API_KEY
#  as environment variables, or paste values directly below.
# ─────────────────────────────────────────────────────────────

# Server
server.port=8080
spring.application.name=travel-planner-agent

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# ── IBM WatsonX.ai (IBM Granite) ─────────────────────────────
watsonx.api-key=zuuFG0Tg5M7gLXfHVGLVicGzinP8R_mactP-2SVNQy0t
watsonx.project-id=113f2ea2-fb33-460d-9fe2-e9530980294f
watsonx.url=https://eu-gb.ml.cloud.ibm.com
watsonx.model-id=ibm/granite-3-8b-instruct

# ── OpenWeatherMap ────────────────────────────────────────────
weather.api-key=${WEATHER_API_KEY:}
weather.base-url=https://api.openweathermap.org/data/2.5

# ── Logging ──────────────────────────────────────────────────
logging.level.com.travelagent=INFO
logging.level.org.springframework.web=WARN
